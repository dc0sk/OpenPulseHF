[package]
name = "openpulse-mesh"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "openpulse-mesh"
path = "src/main.rs"

# No `cpal` feature (#1251): this binary has no PTT controller, no carrier sense and no station-ID
# timer, and its beacon carries no callsign. A capability that does not exist cannot be mis-invoked,
# so the route to a sound card is removed rather than guarded at runtime.

[dependencies]
openpulse-core.workspace = true
openpulse-audio.workspace = true
openpulse-modem.workspace = true
openpulse-config.workspace = true
bpsk-plugin.workspace = true
fsk4-plugin.workspace = true
psk8-plugin.workspace = true
qpsk-plugin.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
