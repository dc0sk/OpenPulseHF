[package]
name        = "openpulse-modem"
description = "Modem engine for OpenPulse – wires plugins and audio backends together"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[dependencies]
openpulse-core    = { workspace = true }
openpulse-audio   = { workspace = true }
openpulse-channel = { workspace = true }
openpulse-dsp     = { workspace = true }
bpsk-plugin       = { workspace = true }
qpsk-plugin       = { workspace = true }
tracing           = { workspace = true }
rand              = { workspace = true }
rustfft           = { workspace = true }
serde             = { workspace = true, features = ["derive"] }
serde_json        = { workspace = true }
tokio             = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
openpulse-config = { path = "../openpulse-config" }
# Test-only: `tx_airtime.rs` asserts a frame's airtime against the REAL `DEFAULT_PTT_MAX` rather
# than restating 180 s, so the gate cannot pass while the constant it guards has moved. No cycle:
# `openpulse-radio` depends on no other workspace crate.
openpulse-radio = { path = "../openpulse-radio", default-features = false }
js8-plugin = { workspace = true }
mfsk16-plugin = { workspace = true }
psk8-plugin = { workspace = true }
fsk4-plugin = { workspace = true }
scfdma-plugin = { workspace = true }
qam64-plugin = { workspace = true }
ofdm-plugin = { workspace = true }
pilot-plugin = { workspace = true }
openpulse-filexfer = { workspace = true }
ed25519-dalek = { version = "2.0" }
tracing-subscriber = { workspace = true }
