[package]
name        = "bpsk-plugin"
description = "BPSK modulation/demodulation plugin for OpenPulse"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[features]
gpu = ["dep:openpulse-gpu"]
# The #1062 PN-63 candidate preamble as `-PN` modes, for measurement against the shipped one
# (docs/dev/design/pn-preamble.md, F1). Never enabled in a shipped build.
pn-candidate = []

[dependencies]
openpulse-core = { workspace = true }
openpulse-dsp  = { workspace = true }
openpulse-gpu  = { workspace = true, optional = true }
num-complex    = { workspace = true }

[dev-dependencies]
bytemuck         = { workspace = true }
pollster         = { workspace = true }
wgpu             = { workspace = true }
criterion        = { workspace = true }
openpulse-channel = { workspace = true }

[[bench]]
name    = "gpu_vs_cpu"
harness = false

[[bench]]
name    = "rrc_fir_bench"
harness = false
