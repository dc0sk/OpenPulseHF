name: Release

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: test-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
      - name: Run tests
        run: cargo test --workspace --no-default-features --locked
      - name: Clippy
        run: cargo clippy --workspace --no-default-features --all-targets -- -D warnings
      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  build-x86-static:
    name: Build static x86-64 binaries
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain + musl target
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: x86-musl-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}

      - name: Build binaries (static musl)
        run: |
          cargo build --release --locked \
            -p openpulse-ardop \
            -p openpulse-kiss \
            -p openpulse-daemon \
            --target x86_64-unknown-linux-musl \
            --no-default-features

      - name: Stage artifacts
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir dist
          cp target/x86_64-unknown-linux-musl/release/openpulse-tnc     "dist/openpulse-tnc_${TAG}_linux_x86_64_static"
          cp target/x86_64-unknown-linux-musl/release/openpulse-kisstnc "dist/openpulse-kisstnc_${TAG}_linux_x86_64_static"
          cp target/x86_64-unknown-linux-musl/release/openpulse-server  "dist/openpulse-server_${TAG}_linux_x86_64_static"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: x86-static
          path: dist/
          retention-days: 7

  build-aarch64-deb:
    name: Build aarch64 .deb packages
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install cross and cargo-deb
        run: |
          cargo install cross --version 0.2.5 --locked
          cargo install cargo-deb --version 3.7.0 --locked

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: aarch64-deb-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}

      - name: Cross-build (aarch64)
        run: |
          cross build --release --locked \
            -p openpulse-ardop \
            -p openpulse-kiss \
            -p openpulse-daemon \
            --target aarch64-unknown-linux-gnu \
            --no-default-features

      - name: Package .deb files (aarch64)
        run: |
          for pkg in openpulse-ardop openpulse-kiss openpulse-daemon; do
            cargo deb -p "$pkg" \
              --no-build \
              --target aarch64-unknown-linux-gnu
          done

      - name: Stage .deb artifacts
        run: |
          mkdir dist
          find target/aarch64-unknown-linux-gnu/debian -name '*.deb' -exec cp {} dist/ \;

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aarch64-deb
          path: dist/
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [test, build-x86-static, build-aarch64-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download x86 static binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: x86-static
          path: dist/

      - name: Download aarch64 .deb packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aarch64-deb
          path: dist/

      - name: Create release and upload assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
